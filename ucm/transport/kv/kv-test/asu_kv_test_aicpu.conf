# Example kv-test + ASU client config for the AICPU staged-URMA provider.
# Format: key=value. Lines starting with # are ignored.
#
# Usage:
#   KV_TEST_CONFIG=./ucm/transport/kv/kv-test/asu_kv_test_aicpu.conf kv-test config check
#   kv-test connect --configpath ./ucm/transport/kv/kv-test/asu_kv_test_aicpu.conf
#
# The matching staged server should run kv_hash_staged_server with --conn-mode rm.
# ASU uses its fixed 1 query + 4 load + 3 store QP layout, so start the server
# with --jetties 8 and --max-accepts 0.

# ASU client identity and wait behavior.
client_id=kv-test-aicpu-client-0
default_wait_timeout_ms=30000

# Optional runtime library overrides. If omitted, kv-test tries
# KV_TEST_ASU_CLIENT_LIB/KV_TEST_ASU_TRANSPORT_LIB, dynamic linker search paths,
# and the default build-tree sibling directory.
# asu.client_library_path=/path/to/libasu_client.so
# asu.transport_library_path=/path/to/libasu_transport.so

# Relative paths in this file are resolved against the process working
# directory. The example below assumes kv-test is run from the repository root.
view.config_path=./ucm/transport/kv/kv-test/asu_view_aicpu.conf

# Keep transport.asu_ids aligned with asuIds in asu_view_aicpu.conf.
hash_table.type=RING_HASH
ring_hash.virtual_node_count=128
transport.asu_ids=1
transport.provider_type=AICPU

# HCOMM/UB endpoint settings. localIp is the local endpoint address used by
# HCOMM endpoint creation; asu_info.1 local.comm_id is the remote endpoint
# address for this ASU. Both accept IPv4, IPv6, numeric HCOMM comm id, or raw
# 16-byte EID text such as eid:00112233445566778899aabbccddeeff.
# device_id independently selects the local ACL logical device; it is not
# inferred from either EID or the remote logical_device_id in asu_info.1.
# For real UB staged runs, prefer the working UB EID form used by HCOMM on the
# target system; staged_oob_host below is the separate TCP OOB address.
transport.localIp=127.0.0.1
transport.device_id=0
transport.timeout=30000
asu_info.1=protocol=UB,local.comm_id=127.0.0.1,port=9382,local.logical_device_id=6

# Multi-device inference can select the Provider device from the ACL context that the TP worker
# established before creating ASU. The numbered EID keys use ACL logical device ids (0, 1, ...),
# not physical card ids. Keep transport.localIp as the standalone/EngineCore fallback.
# transport.aicpu_device_selection=current_acl
# transport.aicpu_local_eid.0=eid:00112233445566778899aabbccddeeff
# transport.aicpu_local_eid.1=eid:ffeeddccbbaa99887766554433221100

# SQE fields whose configured values differ from protocol defaults.
transport.kv_ns_id=1
transport.sc=true

# AICPU always targets Staged URMA. The default build uses
# UCM_ASU_AICPU_USE_STAGED_CHANNEL_API=ON, where connection and MR publication
# OOB use this host TCP address. The OOB port defaults to the endpoint port in
# asu_info.1. A future standard HcommChannelCreate integration can build with
# that CMake option OFF without adding a runtime config key.
transport.aicpu_staged_oob_host=127.0.0.1

# Optional HIXL kernel JSON override. If unset, the provider uses
# HIXL_KERNEL_JSON or ASCEND_HOME_PATH plus the default CANN suffix.
# transport.aicpu_hixl_kernel_json=/path/to/libcann_hixl_kernel.json

# kv-test data generation defaults. Keep count small for smoke tests.
kv.key_prefix=k
kv.seed=20260530
kv.value_size=4096
kv.count=1

# Operation limits used by kv-test validation.
limits.memory_max_bytes=4294967296

# Bench defaults. CLI flags can override these.
bench.io_size=4096
bench.concurrency=1
bench.duration_sec=10
bench.warmup_sec=1
bench.read_ratio=50
bench.write_ratio=50
bench.batch_size=1

# ResultWriter output directory.
output.path=./kv-test-output/aicpu
output.realtime_file_max_bytes=104857600
