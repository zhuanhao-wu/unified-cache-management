# Example ASU view config for kv-test using the AICPU provider.
# Format: key=value. Refresh reads this file again; this module does not modify it.
#
# Keep this endpoint aligned with asu_kv_test_aicpu.conf.
# local.comm_id accepts IPv4, IPv6, or numeric HCOMM comm id. For real UB runs,
# replace 127.0.0.1 with the working UB endpoint address for the staged server.

viewEpoch=1
viewId=1
asuIds=1
asu_info.1=protocol=UB,local.comm_id=127.0.0.1,port=9382,local.logical_device_id=6
