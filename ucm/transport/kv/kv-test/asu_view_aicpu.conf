# Example ASU view config for kv-test using the AICPU provider.
# Format: key=value. Refresh reads this file again; this module does not modify it.
#
# Keep this endpoint aligned with asu_kv_test_aicpu.conf.
# local.comm_id accepts IPv4, IPv6, numeric HCOMM comm id, or raw 16-byte EID
# text such as eid:00112233445566778899aabbccddeeff. For real UB staged runs,
# prefer the working UB EID form for the staged server.

viewEpoch=1
viewId=1
asuIds=1
asu_info.1=protocol=UB,local.comm_id=192.0.2.20,port=9382,local.logical_device_id=0
